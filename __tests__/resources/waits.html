<html>

        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <div>
            <span id="always_displayed">
                This text will always be displayed
            </span>
            <span id="temporary_text">and this text will disappear</span>
            <div id="void"></div>
        </div>
        <script>
            setTimeout(() => {
                document.getElementById('temporary_text').remove();
                
                const newSpan = document.createElement("div");
                newSpan.setAttribute('id', 'new_text');
                newSpan.appendChild(
                    document.createTextNode("and this text was added dynamically")
                );
                document.body.appendChild(newSpan);
            }, 250);
        </script>
            
    </body>
