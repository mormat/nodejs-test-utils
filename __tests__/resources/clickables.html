<!DOCTYPE html>
<html>
    <head>
        <title>Clickables</title>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
    </head>
    <body>
        <p>
            <a class="clickable" href="#">some link</a>
        </p>
        <p id="section">
            <a class="clickable" href="#">some link in section</a>
        </p>
        <p id="comments"></p>
        <script>
            const items = document.querySelectorAll('.clickable');
            for (const item of items) {
                item.addEventListener('click', function(e) {
                    e.preventDefault();
                    const comments = `clicked on "${e.target.innerHTML}"`;
                    document.getElementById('comments').innerHTML = comments;
                });
            }
        </script>
    </body>
</html>
